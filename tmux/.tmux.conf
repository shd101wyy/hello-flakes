# Options to make tmux more pleasant
set -g mouse on
set -g default-terminal "tmux-256color"

# Hand-rolled dark status bar (catppuccin-mocha palette, plain characters only).
# No theme plugin: the status bar shows the session name on the left and the
# window list. #W = window name, so manual renames (prefix + ,) stick.
set -g status-left-length 100
set -g status-right ""
set -g status-style "bg=#181825,fg=#cdd6f4"

# Session name pill on the left, with a gap before the window list.
# The pill turns red while the prefix key (ctrl+b) is held.
set -g status-left "#[fg=#11111b,bg=#{?client_prefix,#f38ba8,#cba6f7},bold] #S #[default] "

# Window list: dim index + name; the active window gets a blue pill
set -g window-status-format " #[fg=#585b70]#I #[fg=#cdd6f4]#W "
set -g window-status-current-format "#[fg=#11111b,bg=#89b4fa,bold] #I #W #[default] "

# Show "session · running app" in the terminal's tab title (e.g. Windows Terminal)
set -g set-titles on
set -g set-titles-string "#S · #{pane_current_command}"
